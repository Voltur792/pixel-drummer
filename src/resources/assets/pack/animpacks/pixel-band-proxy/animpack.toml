# SHE WALKS ALONG THE EDGE — the first use `walk.png` has ever had.
#
# The sheet has shipped and been declared since the pixel avatar landed, and nothing played it:
# `TODO.md` carried it as "walk.png has no trigger" with the recommendation this state implements.
# No `[[clips]]` row was added for it; it was already here.
#
# **No standing twin.** `sleep`/`action`/`dance` each have one because she can be doing those
# either on the floor or on a window edge, and the graph is guard-less so "go back to where she
# was" has to be a second state. Walking has nowhere else to happen: she walks ALONG a perch, and
# off one there is no line to follow. One state, and it is a perched one.
#
# The seat makes the entrance free: `walk.png`'s cells all end at source row 51, so its derived
# seat is 52 — the value `sit` and `sit_sad` author — and entering or leaving this state moves the
# window by exactly nothing. Same measurement, same reason, as `[states.sit_action]`'s `seat = 52`.
#
# **The engine does not drive this state; it FOLLOWS it.** `walk_start` only asks. The stroll
# behaviour starts moving her along the perch once it observes her actually here, and stops the
# moment she is not — which is also why every one of the edges below is safe: whatever pulls her
# out, the walk ends with her.
#
# Three omissions, each with a reason:
#
#   no `on = "sit"` — rung 1 of the pose invariant would take that edge the instant it noticed a
#   perched pet in a non-sitting state, i.e. on the first frame. The same rule the sleeping pair,
#   the working pair and the six dance states all obey.
#
#   no `on = "unsit"` — that token has no producer but the invariant itself, so the row would be
#   dead data. Losing the perch mid-walk is handled the other way round: the behaviour hands back
#   `walk_end`, which lands her in `sit`, and the invariant does the `unsit` from there.
#
#   no `on = "walk_start"` — a second ask must be a no-op, not a restarted walk. Idempotence by
#   omission, as with `action_start` on the working states and a band on its own dance.
#
# `dragged` is mandatory and the reason is not obvious: `Trigger::Dragged` is deliberately NOT
# raised when the grab lands on an already-perched pet (`app::input`), because sliding her along an
# edge is not picking her up. What puts her into `drag` is the pose invariant, and it does that
# through rung 1 — this row.
#
# **NOTHING ELSE INTERRUPTS A WALK, and that is the fourth omission — the one that cost a live
# test.** Every other perched state (`sit_sleep`, `sit_action`, the three `sit_dance_*`) answers
# `action_start` and the three music bands, and this state was written from that template. It was
# wrong here, and not marginally: the daemon raises `action_start` at a turn's FIRST TOOL CALL,
# `move_companion` IS a tool call, and the two tokens reach the engine in the SAME trigger batch.
# The fold applies them in order and the LAST edge wins — so `walk_left` moved her into this state
# and `action_start`, one token later, pulled her straight back out. The pet never moved, twice out
# of three attempts, and the only difference in the third was that the two landed in different
# frames. An AI-asked move was a coin flip on scheduling.
#
# So: no `action_start`, and no `music_*` either, for the same reason one step further on. A walk is
# SHORT and already in flight; work and a tempo band are both things that will still be true when
# she sits down. A band in particular is a LEVEL Astra re-states on a heartbeat, so it catches her
# in `sit` a few seconds later and nothing is lost — which is exactly the property the file relies
# on for a sleeping pet. `idle_timeout` stays, as the dead-man's handle it is everywhere else.
[states.sit_walk]
clip = "walk"
loop = true
[[states.sit_walk.transitions]]
on = "walk_end"
to = "sit"
[[states.sit_walk.transitions]]
on = "dragged"
to = "drag"
[[states.sit_walk.transitions]]
on = "idle_timeout"
to = "sit_sleep"

# SHE REMINDS YOU — a reminder has fired and its toast is still unanswered.
#
# The producer is in the OTHER repo, and this is the second LEVEL in the file after the music
# band: `reminder_start` means *a toast is standing right now* and Astra RE-STATES it on a
# heartbeat; `reminder_end` means nothing is waiting any more — the toast was closed, snoozed or
# switched off, which in Astra all go through one function. `triggers.rs` carries the reasoning.
# Standalone neither arrives and these two states are unreachable — the standalone contract, not a
# defect.
#
# **One looping clip and no brackets**, so `reminder_end` is IMMEDIATE: there is no outro to cover
# the move, and she leaves in the tick the token lands. `[states.action]` reads differently for that
# reason alone; a future `reminder_out.png` changes the feel without changing a single edge here.
#
# TWO STATES ON ONE SHEET, for the fourth time in this file (`sleep`, `action`, the dance): the
# graph is guard-less, so "go back to where she was" is a second vertex and never a condition on an
# edge. One state exiting to `idle` would leave a perched pet in `idle` for a PACED frame with a
# window jump either side of it — the "мерцание" the sleeping pair was split to fix. The derived
# seat is 52, `sit`'s own, so the perched half enters and leaves without moving the window.
#
# **Neither state answers `reminder_start`.** That absence is what makes the heartbeat a no-op
# instead of a sheet restarting from cell 0 every fifteen seconds — idempotence by omission, as on
# `[states.action]` and a dance on its own band.
#
# THE PRIORITY, and all of it is DATA:
#   * **work outranks a reminder** — both states answer `action_start`, and neither working state
#     answers `reminder_start`. Nothing is lost by waiting: the token is a level, so the first
#     heartbeat after `action_end` brings her back;
#   * **a reminder outranks the music** — the six dance states answer `reminder_start`, and nothing
#     here answers a band (a band is a level too, so the record resumes a heartbeat after);
#   * **a walk is not interrupted** — `[states.sit_walk]` answers no daemon token at all, for the
#     reason written above it, and a reminder raised mid-stroll catches her in `sit` a heartbeat
#     later;
#   * **a sleeping pet is woken by the cue itself**, into `idle` or `sit`, and the daemon's early
#     first re-statement takes it from there — the last paragraph of `[states.sleep]` says why the
#     sleeping states do not answer it directly.
#
# `idle_timeout` is the dead-man's handle, for the reason it is one everywhere else: a looping
# variant raises no `clip_finished`, so if a `reminder_end` is ever lost — a cue the daemon could
# not re-send, a stream that reconnected at the wrong moment — nothing else in this graph can free
# her. While Astra's heartbeat runs it cannot fire, because every statement rouses the clock
# (`app::daemon::rouses`) — unless `[sleep]` is set shorter than the heartbeat, booked in `TODO.md`.
#
# `dragged` is mandatory: the pose invariant declines to overrule a state it does not own, so
# without it a pet picked up mid-reminder would go on reminding you in your hand. No `on = "sit"`
# on either — rung 1 of the invariant would take that edge the frame she was set down on a window
# edge. **The three `walk_*` SIDES are answered on `sit_reminder`, and `walk_start` is not.** A side
# is a person asking (`move_companion`), and it can arrive with no `action_start` ahead of it — a
# second move in one turn, after a heartbeat has put her back here, finds the turn's only
# `action_start` long spent. The start is the engine's own dwell, which has no business walking a
# pet away from a reminder she is showing. The walk ends in `sit`, and the next heartbeat brings the
# reminder back.
[states.reminder]
clip = "reminder"
loop = true
[[states.reminder.transitions]]
on = "reminder_end"
to = "idle"
[[states.reminder.transitions]]
on = "dragged"
to = "drag"
[[states.reminder.transitions]]
on = "action_start"
to = "action"
[[states.reminder.transitions]]
on = "idle_timeout"
to = "sleep"

# The perched twin. One difference and it is the whole point of the state: `reminder_end` lands in
# `sit`, not `idle` — and every other edge lands in its own perched family.
[states.sit_reminder]
clip = "reminder"
loop = true
[[states.sit_reminder.transitions]]
on = "reminder_end"
to = "sit"
[[states.sit_reminder.transitions]]
on = "dragged"
to = "drag"
[[states.sit_reminder.transitions]]
on = "action_start"
to = "sit_action"
[[states.sit_reminder.transitions]]
on = "idle_timeout"
to = "sit_sleep"
[[states.sit_reminder.transitions]]
on = "walk_left"
to = "sit_walk"
[[states.sit_reminder.transitions]]
on = "walk_middle"
to = "sit_walk"
[[states.sit_reminder.transitions]]
on = "walk_right"
to = "sit_walk"

# ─────────────────────────────────────────────────────────────────────────────
# THE OVERLAY AXIS — the weather, drawn over her head while she goes on doing whatever she is doing.
#
# Three tables mirroring the three above them: `[overlay]` is the `[sprite]` of this axis,
# `[[overlay_clips]]` its `[[clips]]`, `[overlays]` its `[states]`. They drive a SECOND
# `AnimatorController` and a SECOND flipbook player (`config/overlay.rs`, `render/overlay.rs`), so
# everything the pet's graph can do — the three-part performance, transitions, variants, gates —
# this one can do too, and none of it had to be written twice.
#
# **Nothing here is raised by this engine.** All five tokens are `triggers::Raiser::Daemon`: Astra
# looks the weather up and sends the cue. Standalone, the graph sits in `none` for ever and the pet
# is bit-identical to the build before the axis existed — the same standalone contract `[states.action]`
# has.
#
# The twelve sheets are CUT from four source sheets whose cells are 64 wide x 76 TALL, three rows =
# appear / loop / disappear. Every source's art fits inside the top 64 rows of its cell (the tallest,
# storm, spans 2..63), so the cut is lossless and keeps each frame's offset from the cell top — which
# is exactly what the cell-to-cell anchoring in `[overlay].offset` depends on.

[overlay]
frame  = 64
scale  = 4
fps    = 10
# See `overlay_law::OFFSET` for how this is read. -20 puts the cloud 8 source px clear of her head,
# the rain's drops 10 px PAST it through her hair, and the storm's bolt 35 px past. Every value
# this has held was settled by looking at the screen, not by the arithmetic — -56 read as a cloud
# somewhere in the sky, -28 still read as too far off her, and this is what the owner asked for.
offset = [0, -20]

# The tempo is a first guess and the numbers here most likely to want the user's eye: 12 fps for the
# two brackets (~0.5 s to appear, ~0.5 s to go) and a slower loop, because the brackets are a move
# and the loop is a mood. Storm runs its loop faster than the others — it is lightning, and
# lightning that dawdles reads as a lamp.
[[overlay_clips]]
name = "weather_sun_in"
file = "builtin:nayu-2d-anims/weather_sun_in.png"
fps  = 12
[[overlay_clips]]
name = "weather_sun"
file = "builtin:nayu-2d-anims/weather_sun_loop.png"
fps  = 5
[[overlay_clips]]
name = "weather_sun_out"
file = "builtin:nayu-2d-anims/weather_sun_out.png"
fps  = 12

[[overlay_clips]]
name = "weather_cloud_in"
file = "builtin:nayu-2d-anims/weather_cloud_in.png"
fps  = 12
[[overlay_clips]]
name = "weather_cloud"
file = "builtin:nayu-2d-anims/weather_cloud_loop.png"
fps  = 5
[[overlay_clips]]
name = "weather_cloud_out"
file = "builtin:nayu-2d-anims/weather_cloud_out.png"
fps  = 12

[[overlay_clips]]
name = "weather_rain_in"
file = "builtin:nayu-2d-anims/weather_rain_in.png"
fps  = 12
[[overlay_clips]]
name = "weather_rain"
file = "builtin:nayu-2d-anims/weather_rain_loop.png"
fps  = 6
[[overlay_clips]]
name = "weather_rain_out"
file = "builtin:nayu-2d-anims/weather_rain_out.png"
fps  = 12

[[overlay_clips]]
name = "weather_storm_in"
file = "builtin:nayu-2d-anims/weather_storm_in.png"
fps  = 12
[[overlay_clips]]
name = "weather_storm"
file = "builtin:nayu-2d-anims/weather_storm_loop.png"
fps  = 8
[[overlay_clips]]
name = "weather_storm_out"
file = "builtin:nayu-2d-anims/weather_storm_out.png"
fps  = 12

[overlays]
default = "none"

# NOTHING IS SHOWING — a state with no clip and no variants, and the axis's whole resting picture.
#
# `validate_state_table` says nothing about a clip-less state, `AnimatorController::select` answers
# `None`, and `Renderer::tick_overlay` stops the player. It is FIRST in the file as well as named in
# `default`, so a typo'd default falls back to it rather than to the weather (a dangling default is
# repaired to the first DEFINED state).
#
# **`resolve_state_table` would otherwise have substituted the first clip here** — the rule that
# keeps a pet with a typo'd state visible rather than click-through — which is why the overlay's
# resolve passes `EmptyState::Keep`. Without it this state would show `weather_sun_in` for ever.
[overlays.none]
[[overlays.none.transitions]]
on = "weather_sun"
to = "sun"
[[overlays.none.transitions]]
on = "weather_cloud"
to = "cloud"
[[overlays.none.transitions]]
on = "weather_rain"
to = "rain"
[[overlays.none.transitions]]
on = "weather_storm"
to = "storm"

# The four weather states. Each answers the other three tokens — so a change of conditions plays the
# outgoing sheet's `end` and then the incoming one's `start`, for free, out of the same
# intro/outro machinery the pet's working state uses — plus `weather_clear`, which is the axis's off
# switch.
#
# **None of them answers its OWN token**, and that is idempotence by omission, exactly as
# `[states.action]` gets it: a second lookup of the same conditions must be a no-op, not a restarted
# appearance.
#
# There is deliberately no `dragged` edge and no `idle_timeout` one. The overlay is not a pose, so
# the pose invariant never touches it; and an overlay that outlives its turn is a cosmetic fault,
# not a pet stuck in a work loop, so it needs no dead-man's handle. The daemon closes the bracket.
[overlays.sun]
clip  = "weather_sun"
loop  = true
start = "weather_sun_in"
end   = "weather_sun_out"
[[overlays.sun.transitions]]
on = "weather_clear"
to = "none"
[[overlays.sun.transitions]]
on = "weather_cloud"
to = "cloud"
[[overlays.sun.transitions]]
on = "weather_rain"
to = "rain"
[[overlays.sun.transitions]]
on = "weather_storm"
to = "storm"

[overlays.cloud]
clip  = "weather_cloud"
loop  = true
start = "weather_cloud_in"
end   = "weather_cloud_out"
[[overlays.cloud.transitions]]
on = "weather_clear"
to = "none"
[[overlays.cloud.transitions]]
on = "weather_sun"
to = "sun"
[[overlays.cloud.transitions]]
on = "weather_rain"
to = "rain"
[[overlays.cloud.transitions]]
on = "weather_storm"
to = "storm"

[overlays.rain]
clip  = "weather_rain"
loop  = true
start = "weather_rain_in"
end   = "weather_rain_out"
[[overlays.rain.transitions]]
on = "weather_clear"
to = "none"
[[overlays.rain.transitions]]
on = "weather_sun"
to = "sun"
[[overlays.rain.transitions]]
on = "weather_cloud"
to = "cloud"
[[overlays.rain.transitions]]
on = "weather_storm"
to = "storm"

[overlays.storm]
